<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CamperLog{% endblock %}</title>
  {% block head_extra %}{% endblock %}
  <style>
    /* Mobile-first: Basis = Handy (einspaltig), größere Bildschirme erweitern per min-width. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #1a1a1a; padding: 1rem; line-height: 1.4; }
    main { max-width: 64rem; margin: 0 auto; }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.1rem; margin-bottom: 0.75rem; color: #333; }

    .topbar { max-width: 64rem; margin: 0 auto 1.25rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .topbar form { margin: 0; }

    .stats {
      display: grid;
      grid-template-columns: 1fr;
      gap: .75rem;
      margin-bottom: 1.5rem;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .card h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: .05em; color: #666; margin-bottom: .4rem; }
    .card p { font-size: 1.75rem; font-weight: 700; color: #2563eb; }

    section { margin-bottom: 2rem; }
    .chart-wrap { background: #fff; border-radius: 8px; padding: 1rem; box-shadow: 0 1px 4px rgba(0,0,0,.08); position: relative; height: 16rem; }

    /* Tabellen: auf dem Handy wird jede Zeile zur Karte (Label aus data-label), damit nichts seitlich scrollt. */
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    tr { display: block; padding: .5rem 1rem; border-bottom: 1px solid #f0f0f0; }
    tr:last-child { border-bottom: none; }
    td { display: flex; justify-content: space-between; gap: 1rem; padding: .25rem 0; font-size: .9rem; text-align: right; }
    td::before { content: attr(data-label); font-weight: 600; color: #555; text-align: left; }
    td.empty { display: block; text-align: left; color: #888; }
    td.empty::before { content: none; }

    .form-card { background: #fff; border-radius: 8px; padding: 1.25rem; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .form-row { display: flex; flex-direction: column; gap: .75rem; }
    .form-group { display: flex; flex-direction: column; gap: .3rem; }
    .form-group label { font-size: .8rem; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: .04em; }
    /* 16px Schrift verhindert den Auto-Zoom von iOS Safari beim Fokussieren. */
    .form-group input { min-height: 2.75rem; padding: .5rem .75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; font-family: inherit; width: 100%; }
    .form-group input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,.15); }
    .btn { min-height: 2.75rem; padding: .5rem 1.25rem; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; font-family: inherit; cursor: pointer; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #e5e7eb; color: #1a1a1a; }
    .btn-secondary:hover { background: #d1d5db; }
    .form-error { margin-top: .5rem; font-size: .9rem; color: #dc2626; min-height: 1.2em; }

    @media (min-width: 40em) {
      body { padding: 2rem; }
      h1 { font-size: 1.8rem; }
      .topbar { margin-bottom: 1.5rem; }
      .stats { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
      .card { padding: 1.25rem 1.5rem; }
      .card p { font-size: 2rem; }
      section { margin-bottom: 2.5rem; }
      .chart-wrap { height: 20rem; }

      thead { position: static; width: auto; height: auto; overflow: visible; clip: auto; }
      table { display: table; }
      tr { display: table-row; padding: 0; }
      th { background: #2563eb; color: #fff; text-align: left; padding: .6rem 1rem; font-size: .85rem; }
      td { display: table-cell; padding: .6rem 1rem; text-align: left; border-bottom: 1px solid #f0f0f0; }
      td::before { content: none; }
      td.empty { display: table-cell; }
      tr:last-child td { border-bottom: none; }
      tr:nth-child(even) td { background: #fafafa; }

      .form-row { flex-direction: row; flex-wrap: wrap; align-items: flex-end; }
      .form-group input { width: auto; }
      .form-group.km input { width: 7rem; }
    }
    {% block style %}{% endblock %}
  </style>
</head>
<body>

<div class="topbar">
  <h1>{% block heading %}CamperLog{% endblock %}</h1>
  {% block header_actions %}
  {% if show_logout %}
  <form method="post" action="/logout">
    <button type="submit" class="btn btn-secondary">Logout</button>
  </form>
  {% endif %}
  {% endblock %}
</div>

<main>
{% block content %}{% endblock %}
</main>

{% block scripts %}{% endblock %}
</body>
</html>
